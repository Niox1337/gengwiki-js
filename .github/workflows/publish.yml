name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm's trusted publisher is tied to this environment, so no token is stored anywhere.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches both version numbers
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          grep -q "VERSION = \"${GITHUB_REF_NAME#v}\"" src/version.ts
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public
